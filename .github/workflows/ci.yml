name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          make lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq bc

      - name: Run unit tests
        run: |
          make test-unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd systemd-sysv iproute2 procps coreutils util-linux

      - name: Install linux-first-aid
        run: |
          sudo make install

      - name: Run integration tests
        run: |
          sudo make test-integration

  format:
    name: Format Check (shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          shfmt -i 4 -ci -d bin/first-aid lib/core/*.sh lib/modules/*.sh lib/utils/*.sh tests/unit/*.sh tests/integration/*.sh

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration, format]
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release package
        run: |
          make release

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/linux-first-aid-${{ github.event.release.tag_name }}.tar.gz
          asset_name: linux-first-aid-${{ github.event.release.tag_name }}.tar.gz
          asset_content_type: application/gzip

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t linux-first-aid:latest .

      - name: Test Docker image
        run: |
          docker run --rm linux-first-aid:latest first-aid --version
          docker run --rm linux-first-aid:latest first-aid --help

  shellcheck:
    name: ShellCheck (All Shell Files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all shell files
        run: |
          find . -name "*.sh" -type f -print0 | xargs -0 shellcheck -S error

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint README.md CONTRIBUTING.md docs/*.md || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true